<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><title>报销材料生成 · 志工实践工作台</title><link rel="stylesheet" href="reimbursement/reimbursement.css"></head><body><main>
<header><a href="./#home">← 部门工作台</a><h1>报销材料生成</h1><p>上传发票，核对信息，下载整套材料。</p></header>
<div class="intro"><span class="eyebrow">报销材料生成</span><h1>一笔报销，材料一次备齐</h1><p>上传发票后，填写领款人和事项信息。系统会根据费用类别准备相应材料。</p><div class="steps"><span><b>1</b> 上传发票</span><span><b>2</b> 核对信息</span><span><b>3</b> 下载材料</span></div></div>
<section class="card"><div class="section-head"><div><span class="eyebrow">第一步</span><h2>上传发票</h2></div><span class="badge">本机处理</span></div><label class="drop"><span class="upload-icon">＋</span><span><strong>选择发票，可一次上传多张</strong><small>支持 PDF、图片和 OFD。PDF 和图片会尝试识别金额。</small></span><input id="invoices" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.ofd" multiple disabled></label><div id="invoiceRows"></div><p id="recognition" class="hint" role="status">正在准备工具…</p></section>
<section class="card"><div class="section-head"><div><span class="eyebrow">第二步</span><h2>填写报销信息</h2><p class="hint">发票的开票日期仅供参考，请填写实际发生日期。</p></div></div><form id="claimForm">
<div class="fields"><label>费用类别<select id="category" required><option value="">请选择类别</option><option value="transport">交通</option><option value="courier">快递</option><option value="meal">加班餐</option><option value="supplies">物资购买</option><option value="labor">劳务</option><option value="other">其他</option></select></label><label>本次总金额（元）<input id="amount" inputmode="decimal" placeholder="按发票填写" required></label></div>
<div class="fields date-fields"><label><span id="eventDateLabel">费用发生日期</span><input id="eventDate" type="date" required><small id="eventDateHelp">实际发生费用的日期</small></label><label>材料落款日期<input id="documentDate" type="date" required><small>用于报销凭单和情况说明落款，可修改</small></label></div>
<label class="wide">具体事由<textarea id="purpose" rows="2" maxlength="300" placeholder="例如：校运会志愿者工作餐" required></textarea></label>
<div class="subhead"><h3>领款人信息</h3><p>填写这笔报销款打给谁。</p></div><div class="fields"><label>领款人姓名<input id="payee" maxlength="30" autocomplete="name" required></label><label>领款人学号 / 工号<input id="payeeId" maxlength="30" required></label><label>报销部门<select id="department" required><option value="">请选择部门</option><option>志愿者工作部</option><option>社会实践部</option></select></label><label>经费号<input id="fund" maxlength="40" placeholder="按实际经费填写" required></label></div>
<div id="routeFields" class="fields" hidden><label><span id="fromLabel">出发地</span><input id="from" maxlength="150"></label><label><span id="toLabel">目的地</span><input id="to" maxlength="150"></label></div><label id="locationField" hidden>用餐或工作地点<input id="location" maxlength="150"></label><p id="mealCount" class="callout" hidden></p>
<label id="otherCheck" class="check" hidden><input id="otherConfirmed" type="checkbox">已确认本次其他费用需要的附件</label><details class="optional"><summary>其他信息（选填）</summary><div class="fields"><label>费用负责人<input id="principal" maxlength="30"></label><label>负责人学工号<input id="principalId" maxlength="30"></label><label>验收人<input id="acceptor" maxlength="30"></label><label>联系电话<input id="contact" type="tel" maxlength="30"></label></div></details><label class="check remember"><input id="remember" type="checkbox" checked>记住本机领款人和部门信息，下次自动填写</label></form></section>
<section id="attachments" class="card" hidden><div class="section-head"><div><span class="eyebrow">第三步</span><h2>补充材料</h2><p id="materialList" class="hint"></p></div></div><div id="attachmentInputs"></div><details class="optional"><summary>添加其他附件（选填）</summary><label>选择附件<input id="extra" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.docx,.doc,.ofd"></label></details></section>
<section class="download-card"><div><h2>准备下载</h2><p id="missing" class="hint"></p></div><label class="check"><input id="confirmed" type="checkbox">我已核对金额、两个日期和领款人信息</label><button id="generate" class="primary" disabled>生成并下载材料包</button><p id="status" role="status" aria-live="polite"></p></section>
<footer>材料在当前浏览器处理。签字、盖章及行程单手写按实际办理。</footer>
</main><script src="vendor/exceljs-4.4.0.min.js"></script><script src="vendor/jszip-3.10.1.min.js"></script><script type="module" src="reimbursement/app.mjs"></script></body></html>
