<div id="wsQueryTools" class="ws-query-tools">
  <div class="ws-query-top">
    <p id="wsResultCount" aria-live="polite"></p>
    <div class="ws-query-actions">
      <label class="ws-sort"><span class="ws-sr-only">结果排序</span><select id="wsResultSort"><option value="department">按部门排序</option><option value="name">按姓名排序</option><option value="campus">按校区排序</option></select></label>
      <details class="ws-result-actions">
        <summary>更多操作</summary>
        <div>
          <button id="exportQuery">导出筛选结果</button>
          <button id="wsSelectPage">选择本页空闲</button>
          <button id="wsDensity" aria-pressed="false">紧凑显示</button>
          <button id="wsSaveQuery">收藏查询</button>
          <button id="wsShareQuery">复制查询链接</button>
        </div>
      </details>
    </div>
  </div>
  <div id="wsQuerySaved" hidden></div>
</div>
