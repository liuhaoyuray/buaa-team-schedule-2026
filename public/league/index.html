<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团统数据查询</title><link rel="stylesheet" href="league.css"></head><body><main><header><div><span class="kicker">2026 · 团组织与团员统计</span><h1>团统数据查询</h1><p>按单位、培养层次或年级查询数据，比较上年变化，查看原表需要核对的地方。</p></div><div class="source-pill">本科生截至 10 月 12 日<br>研究生截至 10 月 14 日</div></header><nav class="tabs" aria-label="数据页面"><button data-tab="overview" class="active">数据查询</button><button data-tab="compare">年度对比</button><button data-tab="audit">数据核对 <span id="auditCount"></span></button><button data-tab="source">数据说明</button></nav><section class="filters"><label>学生类别<select id="kind"><option value="">本科生与研究生</option><option>本科生</option><option>研究生</option></select></label><label id="levelLabel">查看方式<select id="level"><option value="college">按单位汇总</option><option value="detail">全部年级和培养层次</option><option>2023级</option><option>2024级</option><option>2025级</option><option>2026级</option><option>硕士</option><option>博士</option></select></label><label>搜索单位<input id="search" type="search" placeholder="输入学院、书院或系号"></label><button id="reset">重置筛选</button></section><div id="overview" class="view"><div id="stats" class="stats"></div><div class="notice" id="scopeNotice"></div><div class="panel"><div class="panel-head"><div><h2 id="tableTitle">单位数据</h2><p id="count"></p></div><div class="table-actions"><label>排序<select id="sort"><option value="default">按原表顺序</option><option value="members">团员数从高到低</option><option value="students">学生数从高到低</option><option value="branches">团支部数从高到低</option><option value="rate">团员占学生比例从高到低</option></select></label><button id="export" class="action">导出当前结果 CSV</button></div></div><div class="table-scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></div></div><div id="compare" class="view" hidden><div class="panel"><div class="panel-head"><div><h2>2025—2026 年度对比</h2><p>2025、2026 年数据取自原对比表；变化比例根据两年数值计算，空白表示原表未填写。</p></div><button id="exportCompare" class="action">导出当前对比 CSV</button></div><label class="metric-label">选择指标<select id="metric"><option value="members">团员数</option><option value="students">学生数</option><option value="branches">团支部数</option><option value="branchesGeneral">团总支数</option><option value="cadres">兼职团干部数</option><option value="masters">硕士总数（研究生）</option><option value="doctor">博士总数（研究生）</option></select></label><div class="table-scroll"><table><thead><tr><th>学生类别</th><th>单位</th><th>2025 年</th><th>2026 年</th><th>增减人数 / 数量</th><th>变化比例</th><th>原表备注</th><th>来源</th></tr></thead><tbody id="compareBody"></tbody></table></div></div></div><div id="audit" class="view" hidden><div class="panel"><div class="panel-head"><div><h2>需要核对的数据</h2><p>按原表数值检查，不自动改动。相同名称匹配、逐项相加后再进行比较。</p></div><button id="exportAudit" class="action">导出核对清单 CSV</button></div><div class="table-scroll"><table><thead><tr><th>学生类别</th><th>单位</th><th>检查事项</th><th>指标</th><th>数值差异</th><th>原表行号</th></tr></thead><tbody id="auditBody"></tbody></table></div></div></div><div id="source" class="view" hidden><div class="panel"><h2>来源与统计口径</h2><div id="sourceBody"></div><p><a href="data.json" target="_blank" rel="noopener">下载结构化数据 JSON ↗</a>（适合其他程序读取）</p></div></div></main><script type="module" src="league.js"></script></body></html>
