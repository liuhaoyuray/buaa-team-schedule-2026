<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作学院物资签领表</title><style>body{margin:0;background:#101c31;color:#dfebfb;font:14px/1.65 system-ui,'Microsoft YaHei',sans-serif}*{box-sizing:border-box}h2{font-size:20px;margin:0}p{color:#a9bdd8;margin:8px 0 16px}label{display:block;font-weight:600;margin:14px 0 5px}input,textarea,button{font:inherit;border-radius:9px}input,textarea{width:100%;padding:10px;background:#0b172a;color:#fff;border:1px solid #526581}textarea{min-height:175px;resize:vertical}button{padding:10px 16px;background:#a9d8ce;border:0;color:#12263a;font-weight:700;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5;cursor:not-allowed}.preview{overflow:auto;margin-top:16px;max-height:340px;border:1px solid #344861;border-radius:9px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #344861;text-align:left;white-space:nowrap}th{background:#1b3049}#status{white-space:pre-wrap;color:#d8e5f6}.warn{color:#ffd69c}small{color:#a9bdd8}a{color:#a9d8ce}</style></head><body><h2>生成学院物资签领表</h2><p>按学院汇总数量，自动填写系号，保留领取人签名和联系方式栏。表格参照原有学院签领表排版。</p><label for="title">签领表标题</label><input id="title" value="物资签领表" maxlength="80"><label for="file">上传名单或数量表（Excel）</label><input id="file" type="file" accept=".xlsx"><small>读取第一个工作表。也可以从 Excel 复制表格，粘贴到下方。</small><label for="rows">核对或粘贴表格内容</label><textarea id="rows" placeholder="单位&#9;物资类别&#9;数量&#10;电子信息工程学院&#9;证书&#9;2&#10;材料科学与工程学院&#9;徽章&#9;3"></textarea><p>第一行请填写列名。支持“单位、物资类别、数量”，也支持“单位、证书、徽章”等按类别分列的数量表；名单没有数量列时，每行按 1 件计。只填写单位时，将按行数统计。</p><button id="check">核对并预览</button><button id="download" disabled>下载签领表 Excel</button><div id="status" role="status"></div><div class="preview" id="preview" hidden></div><script src="vendor/exceljs-4.4.0.min.js"></script><script src="signature.js"></script></body></html>
