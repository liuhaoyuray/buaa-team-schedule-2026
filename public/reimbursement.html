<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' blob: data:; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><title>报销材料生成 · 志工实践工作台</title><link rel="stylesheet" href="reimbursement/reimbursement.css"></head><body><main>
<header><a href="./#home">← 部门工作台</a><span>志工 · 实践</span><h1>报销材料生成</h1><p>上传发票，补齐必要信息，下载填好的整套材料。</p></header>
<section class="card"><div class="step">01 / 放入发票</div><h2>从发票开始</h2><label class="drop">选择发票，可一次上传多张<input id="invoices" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.ofd" multiple disabled><small>PDF、图片会尝试识别日期与金额；OFD请手动填写。一次处理同一事项、同一类别的费用。</small></label><div id="invoiceRows"></div><p id="recognition" class="hint" role="status">正在准备工具…</p></section>
<section class="card"><div class="step">02 / 只填需要的信息</div><h2>核对这笔费用</h2><form id="claimForm"><div class="fields"><label>费用类别 <b>必选</b><select id="category" required><option value="">请选择</option><option value="transport">交通</option><option value="courier">快递</option><option value="meal">加班餐</option><option value="supplies">物资购买</option><option value="labor">劳务</option><option value="other">其他</option></select></label><label>费用日期 <b>必填</b><input id="date" type="date" required></label><label>本次总金额（元） <b>必填</b><input id="amount" inputmode="decimal" placeholder="按发票填写" required></label><label>报销部门 <b>必选</b><select id="department" required><option value="">请选择</option><option>志愿者工作部</option><option>社会实践部</option></select></label></div><label class="wide">具体事由 <b>必填</b><textarea id="purpose" rows="2" maxlength="300" placeholder="例如：校运会志愿者工作物资采购，购买文件袋与文具" required></textarea></label><div class="fields"><label>经办人姓名 <b>必填</b><input id="person" maxlength="30" autocomplete="name" required></label><label>经办人学号 / 工号 <b>必填</b><input id="studentId" maxlength="30" required></label><label>经费号 <b>必填</b><input id="fund" maxlength="40" placeholder="按实际经费填写" required></label><label>联系电话<input id="contact" type="tel" maxlength="30"></label></div><div id="routeFields" class="fields" hidden><label><span id="fromLabel">出发地</span><input id="from" maxlength="150"></label><label><span id="toLabel">目的地</span><input id="to" maxlength="150"></label></div><label id="locationField" hidden>用餐或工作地点 <b>加班餐必填</b><input id="location" maxlength="150"></label><p id="mealCount" class="callout" hidden></p><label id="otherCheck" class="check" hidden><input id="otherConfirmed" type="checkbox">已确认本次其他费用需要的附件，并在下方上传</label><details><summary>负责人及验收人（按实际需要填写）</summary><div class="fields"><label>费用负责人<input id="principal" maxlength="30"></label><label>负责人学工号<input id="principalId" maxlength="30"></label><label>验收人<input id="acceptor" maxlength="30"></label></div></details><label class="check"><input id="remember" type="checkbox" checked>记住本机经办信息，下次少填一些</label></form></section>
<section id="attachments" class="card" hidden><div class="step">03 / 补齐本类别附件</div><h2>系统会自动选好材料</h2><p id="materialList" class="hint"></p><div id="attachmentInputs"></div><details><summary>其他补充附件（可选）</summary><label>上传附件<input id="extra" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.xlsx,.xls,.docx,.doc,.ofd"></label></details></section>
<section class="download-card"><p id="missing" class="hint"></p><label class="check"><input id="confirmed" type="checkbox">我已核对发票金额、日期及上述填写内容</label><button id="generate" class="primary" disabled>生成并下载材料 ZIP</button><p id="status" role="status" aria-live="polite"></p></section>
<footer>所有处理均在当前浏览器完成，不上传发票或调用外部识别服务。页面刷新后需重新上传，请先下载材料。签字、盖章及行程单手写按实际办理。</footer>
</main><script src="vendor/exceljs-4.4.0.min.js"></script><script src="vendor/jszip-3.10.1.min.js"></script><script type="module" src="reimbursement/app.mjs"></script></body></html>
