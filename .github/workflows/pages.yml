name: 同步课表并发布网页

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: schedule-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 读取仓库
        uses: actions/checkout@v6
        with:
          ref: main
      - name: 同步现有平台
        run: node scripts/sync-site.mjs
      - name: 检查时长导入与同步接入
        run: node --test tests/*.test.mjs
      - name: 保存变化
        shell: bash
        run: |
          git add public .sync/source.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "同步课表平台"
            git push origin HEAD:main
          fi
      - name: 配置 Pages
        uses: actions/configure-pages@v5
      - name: 上传网页
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: public
      - name: 等待发布产物可用
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          for attempt in {1..8}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --silent; then
              # Allow the artifact to appear in the run listing used by deploy-pages.
              sleep 5
              exit 0
            fi
            sleep 3
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become available."
          exit 1
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 900000
