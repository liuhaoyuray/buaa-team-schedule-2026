name: Inspect the awards Pages deployment status
on:
  push:
    branches: [ops/recover-awards-pages-20261107]
    paths: [.github/workflows/recover-pages.yml]
permissions:
  pages: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read status for the exact awards deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/6ba01eff2bdaff781e7ea515e87a910dc4f1729f"
          curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url" | jq '{status, page_url, id}'
